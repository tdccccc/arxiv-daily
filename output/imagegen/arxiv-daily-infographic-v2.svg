            <rect x="232" y="44" width="48" height="34" rx="5" class="soft2" stroke="#e0e5ef"/>
            <rect x="290" y="44" width="48" height="34" rx="5" class="soft2" stroke="#e0e5ef"/>
            <rect x="348" y="44" width="48" height="34" rx="5" class="soft2" stroke="#e0e5ef"/>
          </g>
        </g>
      </g>

