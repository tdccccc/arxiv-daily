<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <style>
      .font { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; }
      .bg { fill: #f3f5f8; }
      .ink { fill: #202431; }
      .muted { fill: #5e6b82; }
      .faint { fill: #8b95a8; }
      .paper { fill: #ffffff; stroke: #dce2ee; stroke-width: 2; }
      .panel { fill: #fbfcff; stroke: #d7deeb; stroke-width: 2; }
      .soft { fill: #edf1f7; }
      .soft2 { fill: #f7f8fb; }
      .purple { fill: #7764e8; }
      .purple-soft { fill: #f0edff; }
      .red { fill: #c7433f; }
      .red-soft { fill: #fff1ef; }
      .green { fill: #2aa876; }
      .green-soft { fill: #e9f8f2; }
      .gold { fill: #f3b44b; }
      .line { stroke: #c7cfdd; stroke-width: 2.5; fill: none; }
      .title { font-size: 76px; font-weight: 880; letter-spacing: 0; }
      .subtitle { font-size: 29px; font-weight: 520; }
      .h2 { font-size: 31px; font-weight: 820; }
      .h3 { font-size: 23px; font-weight: 780; }
      .body { font-size: 21px; font-weight: 520; }
      .small { font-size: 18px; font-weight: 540; }
      .tiny { font-size: 15px; font-weight: 520; }
      .ui { font-size: 16px; font-weight: 560; }
      .ui-bold { font-size: 17px; font-weight: 760; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#596071" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#596071" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="topBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="2048" height="1152"/>
  <path d="M0 0H2048V340C1705 250 1430 310 1140 274C760 227 477 88 0 170Z" fill="#e9edf5"/>

  <g class="font">
    <g transform="translate(92,64)">
      <rect x="0" y="0" width="1864" height="1024" rx="40" fill="#ffffff" stroke="#dce2ee" stroke-width="2"/>
    </g>

    <g transform="translate(132,104)">
      <text x="0" y="58" class="title ink">arXiv Daily</text>
      <text x="4" y="110" class="subtitle muted">把每天的新论文变成 Obsidian 里的筛选、总结与回看系统</text>
    </g>

    <g transform="translate(133,238)" filter="url(#softShadow)">
      <rect x="0" y="0" width="484" height="292" rx="24" fill="#f7f8fc" stroke="#dce2ee" stroke-width="2"/>
      <text x="30" y="52" class="h2 ink">解决什么问题？</text>
      <g class="body muted">
        <text x="32" y="106">每天论文太多，先由插件筛一遍</text>
        <text x="32" y="150">按研究主题归类，减少无效浏览</text>
        <text x="32" y="194">自动写 Markdown 日报和论文笔记</text>
        <text x="32" y="238">用 Dashboard 星标、检索和回看</text>
      </g>
    </g>

    <g transform="translate(133,560)" filter="url(#softShadow)">
      <rect x="0" y="0" width="484" height="330" rx="24" fill="#fff9f4" stroke="#eedcc9" stroke-width="2"/>
      <text x="30" y="52" class="h2 ink">安装和第一次运行</text>
      <g class="body muted">
        <text x="32" y="106">1. Community plugins 中搜索安装</text>
        <text x="32" y="152">2. Enable arXiv Daily</text>
        <text x="32" y="198">3. 填写 API Key 与 arXiv 分类</text>
        <text x="32" y="244">4. 添加研究主题</text>
        <text x="32" y="290">5. 打开 Dashboard，点击 Run Today</text>
      </g>
    </g>

    <g transform="translate(132,930)">
      <rect x="0" y="0" width="484" height="74" rx="22" fill="#242735"/>
      <text x="30" y="46" class="small" fill="#ffffff">适合：每日论文发现、初筛、重点追踪和长期回看</text>
    </g>

    <g transform="translate(660,166)">
