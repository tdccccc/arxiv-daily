      <g transform="translate(34,18)">
        <rect x="0" y="0" width="186" height="50" rx="25" class="red-soft"/>
        <text x="38" y="32" class="small red">arXiv 新论文</text>
        <path d="M202 25H270" class="line"/>
        <rect x="286" y="0" width="174" height="50" rx="25" class="purple-soft"/>
        <text x="330" y="32" class="small purple">主题筛选</text>
