            <text x="152" y="26" class="tiny muted">Starred</text><text x="224" y="26" class="ui-bold ink">8</text>
            <text x="318" y="26" class="tiny muted">Details</text><text x="386" y="26" class="ui-bold ink">5</text>
            <text x="478" y="26" class="tiny muted">Daily reports</text><text x="584" y="26" class="ui-bold ink">12</text>
