      </g>

      <g transform="translate(28,514)">
        <rect x="0" y="0" width="1130" height="194" rx="8" fill="#ffffff" stroke="#d9deea"/>
        <rect x="0" y="0" width="1130" height="38" rx="8" fill="#eef1f7"/>
        <text x="26" y="25" class="tiny muted">☐</text>
        <text x="72" y="25" class="tiny muted">Star</text>
