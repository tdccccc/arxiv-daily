<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1152" viewBox="0 0 2048 1152">
  <defs>
    <style>
      .font { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; }
      .bg { fill: #f5f6fa; }
      .card { fill: #ffffff; stroke: #dbe1ee; stroke-width: 2; }
      .panel { fill: #fbfbfd; stroke: #d7dce8; stroke-width: 2; }
      .soft { fill: #eef1f7; }
      .soft2 { fill: #f7f8fb; }
      .ink { fill: #1f2430; }
      .muted { fill: #647087; }
      .faint { fill: #8b94a8; }
      .accent { fill: #7a67e8; }
      .accent2 { fill: #f0edff; }
      .green { fill: #2aa876; }
      .red { fill: #c7443f; }
      .line { stroke: #c4ccda; stroke-width: 2.5; fill: none; }
      .arrow { stroke: #7a67e8; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .title { font-size: 74px; font-weight: 850; letter-spacing: 0; }
      .subtitle { font-size: 30px; font-weight: 520; }
      .h2 { font-size: 34px; font-weight: 820; }
      .h3 { font-size: 24px; font-weight: 780; }
      .body { font-size: 22px; font-weight: 520; }
      .small { font-size: 18px; font-weight: 520; }
      .tiny { font-size: 15px; font-weight: 520; }
      .ui { font-size: 17px; font-weight: 560; }
      .ui-bold { font-size: 18px; font-weight: 760; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7a67e8"/>
    </marker>
  </defs>

  <rect class="bg" width="2048" height="1152"/>
  <rect x="64" y="54" width="1920" height="1044" rx="34" fill="#ffffff" stroke="#e0e5ef" stroke-width="2"/>

  <g class="font">
    <text x="118" y="142" class="title ink">arXiv Daily</text>
    <text x="122" y="194" class="subtitle muted">把每日 arXiv 论文变成 Obsidian 里的筛选、总结、回看工作流</text>

    <g transform="translate(118,246)">
      <rect x="0" y="0" width="506" height="328" rx="22" fill="#f4f6fb" stroke="#d8dfed" stroke-width="2"/>
      <text x="32" y="58" class="h2 ink">它有什么用？</text>
      <g class="body muted">
        <text x="34" y="116">1. 自动抓取每日 arXiv 新论文</text>
        <text x="34" y="162">2. 按研究主题筛选、归类和排序</text>
        <text x="34" y="208">3. 生成 Markdown 日报与论文笔记</text>
        <text x="34" y="254">4. 在 Dashboard 中搜索、星标、回看</text>
        <text x="34" y="300">5. 一键打开论文、PDF、日报和详细总结</text>
      </g>
    </g>

    <g transform="translate(118,616)">
      <rect x="0" y="0" width="506" height="320" rx="22" fill="#fff8f2" stroke="#efdbc7" stroke-width="2"/>
      <text x="32" y="58" class="h2 ink">怎么安装和使用？</text>
      <g class="body muted">
        <text x="34" y="118">1. 打开 Obsidian Community plugins</text>
        <text x="34" y="164">2. Browse 搜索 arXiv Daily</text>
        <text x="34" y="210">3. Install 并 Enable 插件</text>
        <text x="34" y="256">4. 设置 API Key、arXiv 分类和研究主题</text>
        <text x="34" y="302">5. 打开 Dashboard，点击 Run Today</text>
      </g>
    </g>

    <g transform="translate(676,224)">
      <rect x="0" y="0" width="1214" height="764" rx="28" fill="#f8f9fc" stroke="#d9deea" stroke-width="2"/>

      <g transform="translate(28,28)">
        <text x="0" y="33" class="h3 ink">arXiv Daily Dashboard</text>
        <rect x="1018" y="4" width="92" height="32" rx="7" class="soft"/>
        <text x="1064" y="26" text-anchor="middle" class="ui muted">Refresh</text>
      </g>

      <g transform="translate(28,86)">
        <rect x="0" y="0" width="128" height="34" rx="7" fill="#ffffff" stroke="#7a67e8" stroke-width="2"/>
        <text x="22" y="24" class="ui ink">Starred</text>
