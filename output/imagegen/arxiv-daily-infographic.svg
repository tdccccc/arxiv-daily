        <rect x="748" y="0" width="112" height="34" rx="7" class="green"/>
        <text x="804" y="23" text-anchor="middle" class="ui" fill="#ffffff">Run Today</text>
        <rect x="870" y="0" width="126" height="34" rx="7" class="soft" stroke="#dfe3ec"/>
        <text x="933" y="23" text-anchor="middle" class="ui muted">Run Pending</text>
        <rect x="1006" y="0" width="84" height="34" rx="7" class="soft" stroke="#dfe3ec"/>
        <text x="1048" y="23" text-anchor="middle" class="ui muted">More</text>
      </g>

      <g transform="translate(28,146)">
