        <text x="20" y="32" class="ui-bold ink">Filters</text>
        <text x="20" y="72" class="tiny muted">Search</text>
        <rect x="20" y="84" width="586" height="32" rx="6" fill="#f2f4f8" stroke="#dfe3ec"/>
