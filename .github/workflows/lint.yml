name: Root verification

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v5.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Test release tools
        run: npm run test:release-tools
      - name: Check package boundaries
        run: npm run check:boundaries
      - name: Lint Obsidian plugin
        run: npm run lint
      - name: Typecheck workspaces
        run: npm run typecheck
      - name: Test workspaces
        run: NODE_OPTIONS=--max-old-space-size=8192 npm run test:workspaces -- --maxWorkers=1
      - name: Test settings UI regression
        run: npm --workspace obsidian-arxiv-daily exec vitest -- run --config vitest.config.mts tests/settings-declarative-tab.test.ts
      - name: Build workspaces
        run: npm run build
      - name: Check Obsidian submission requirements
        run: npm run check:obsidian-submission
      - name: Smoke test build artifacts
        run: npm run smoke:build
      - name: Smoke test CLI package installation
        run: npm run smoke:install

  compatibility:
    name: Node ${{ matrix.node-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.19.0", "22.17.0"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck workspaces
        run: npm run typecheck
      - name: Build workspaces
        run: npm run build
      - name: Smoke test build artifacts
        run: npm run smoke:build
