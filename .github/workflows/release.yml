name: Release Obsidian plugin

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify version matches tag
        run: |
          node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
      - name: Verify workspace
        run: |
          npm run check:boundaries
          npm run typecheck
          npm test
          npm run build
          npm run smoke:build
      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            plugin/manifest.json
            plugin/main.js
            plugin/styles.css
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" plugin/manifest.json plugin/main.js plugin/styles.css --clobber
          else
            gh release create "$GITHUB_REF_NAME" plugin/manifest.json plugin/main.js plugin/styles.css --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
