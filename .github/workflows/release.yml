name: Release Obsidian plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "manifest.json version $manifest_version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version $package_version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            manifest.json main.js styles.css \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
