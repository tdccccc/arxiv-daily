name: Release Obsidian plugin

on:
  push:
    tags: ["*.*.*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Job-level env is the documented way to make a secret available in an
      # `if` conditional; set this secret to enable the npm publish step.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out immutable tag target
        # actions/checkout v5.0.1
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify stable tag and release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module - "$TAG" <<'NODE'
          import { validateSemVer } from "./scripts/release-utils.mjs";
          const tag = process.argv[2];
          try {
            validateSemVer(tag);
          } catch (error) {
            console.error(error.message);
            process.exit(1);
          }
          if (tag.includes("-") || tag.includes("+")) {
            console.error(`Release tag must be stable SemVer without prerelease/build metadata: ${tag}`);
            process.exit(1);
          }
          NODE
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$EXPECTED_SHA"
          test -f "docs/releases/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $TAG" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify version matches tag
        run: npm run check:release-version -- "$GITHUB_REF_NAME"
      - name: Verify workspace
        run: |
          npm run test:release-tools
          npm run check:boundaries
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run smoke:build
      - name: Attest release assets
        # actions/attest-build-provenance v4.1.1
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            plugin/manifest.json
            plugin/main.js
            plugin/styles.css
      - name: Create immutable GitHub release with curated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            plugin/manifest.json plugin/main.js plugin/styles.css \
            --verify-tag \
            --title "arXiv Daily $TAG" \
            --notes-file "docs/releases/$TAG.md"
      - name: Publish CLI to npm
        # Skipped until the repository has an NPM_TOKEN secret (Settings →
        # Secrets and variables → Actions). --provenance uses the workflow's
        # id-token to attach a GitHub build provenance attestation.
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --workspace apps/cli --access public --provenance
