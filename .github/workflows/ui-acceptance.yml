name: UI acceptance

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workbench:
    name: Real workbench interaction acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install acceptance browser
        run: npx playwright install --with-deps chromium
      - name: Select the installed Playwright browser
        run: |
          node --input-type=module -e 'import { chromium } from "playwright"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, "ARXIV_DAILY_ACCEPTANCE_BROWSER=" + chromium.executablePath() + "\n");'
      - name: Test acceptance infrastructure
        run: npm run test:acceptance:tools
      - name: Run real workbench journeys
        run: npm run test:acceptance -- --suite workbench --output output/playwright/acceptance/ci
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workbench-acceptance
          path: output/playwright/acceptance/
          if-no-files-found: warn
          retention-days: 7
