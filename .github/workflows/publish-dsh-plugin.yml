name: Publish DSH plugin to npm

on:
  push:
    tags: ["dsh-v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: extensions/dsh-arxiv-daily/package.json version to (re-)publish; must match an existing dsh-v<version> tag
        required: true
        type: string

concurrency:
  group: publish-dsh-plugin-${{ inputs.version || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  native:
    uses: ./.github/workflows/native-storage.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && format('dsh-v{0}', inputs.version) || github.sha }}

  publish:
    needs: native
    runs-on: ubuntu-latest
    env:
      ARXIV_DAILY_NATIVE_RELEASE: "1"
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('dsh-v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/dsh-arxiv-daily/package-lock.json
      - name: Install trusted-publishing npm
        run: npm install --global npm@^11.5.1
      - name: Resolve and verify immutable release tag
        id: release
        run: |
          version="$(node -p "require('./extensions/dsh-arxiv-daily/package.json').version")"
          if test -n "$REQUESTED_VERSION"; then
            test "$version" = "$REQUESTED_VERSION"
          fi
          node --input-type=module - "$version" <<'NODE'
          import { validateSemVer } from "./scripts/release-utils.mjs";
          const version = process.argv[2];
          validateSemVer(version);
          if (version.includes("-") || version.includes("+")) {
            throw new Error(`Publishing version must be stable SemVer: ${version}`);
          }
          NODE
          test "$(git rev-parse "refs/tags/dsh-v$version^{commit}")" = "$(git rev-parse HEAD)"
          if npm view "dsh-arxiv-daily@$version" version >/dev/null 2>&1; then
            echo "Refusing to overwrite existing npm version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify the tag comes from main or this version's release branch
        # A tag push must contain current main; a manual re-publish of an existing
        # tag only has to be reachable, because main moves on after a release.
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'republish' || 'tag' }}
        run: node scripts/check-release-source.mjs --commit "$(git rev-parse HEAD)" --version "$VERSION" --prefix release/dsh- --mode "$MODE"
      - name: Install workspace dependencies
        run: npm ci
      - name: Install plugin test dependencies
        run: npm ci --prefix extensions/dsh-arxiv-daily --ignore-scripts
      - name: Download same-run verified native assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-storage-*
          path: packages/node-runtime/native/prebuilds
          merge-multiple: true
          digest-mismatch: error
      - name: Verify complete native release matrix
        run: node scripts/native-assets.mjs verify
      - name: Verify release candidate
        # The same gates publish-cli applies to the CLI this plugin bundles.
        run: |
          npm run test:release-tools
          npm audit --audit-level=moderate
          npm run check:boundaries
          npm run lint
          npm run typecheck
          NODE_OPTIONS=--max-old-space-size=8192 npm run test:workspaces -- --maxWorkers=1
          npm run build
          npm run smoke:build
          npm run check:product-units
      - name: Build exact CLI and plugin package with the full native matrix
        run: node extensions/dsh-arxiv-daily/build.mjs
      - name: Install pnpm for DSH plugin installs
        # `dsh plugin add` installs packed plugins with pnpm, which hosted
        # runners don't provide.
        run: npm install --global pnpm@11.7.0
      - name: Install verified DSH baseline
        run: npm install --prefix "$RUNNER_TEMP/dsh-host" --ignore-scripts @deepseek-ai/dsh@0.2.1-alpha.2
      - name: Verify plugin and authenticated Host workflows against the release build
        run: DSH_CLI="$RUNNER_TEMP/dsh-host/node_modules/@deepseek-ai/dsh/lib/bin.js" node --test extensions/dsh-arxiv-daily/tests/*.test.mjs
      - name: Verify packed contents before publish
        working-directory: extensions/dsh-arxiv-daily/dist/package
        run: npm pack --dry-run
      - name: Publish DSH plugin with trusted publishing
        working-directory: extensions/dsh-arxiv-daily/dist/package
        run: npm publish --access public
