name: Recover CLI npm publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable release tag to publish to npm
        required: true
        type: string

concurrency:
  group: publish-cli-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Require npm credentials
        run: test -n "$NODE_AUTH_TOKEN"
      - name: Check out immutable release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.17.0
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify immutable unpublished version
        run: |
          node --input-type=module - "$VERSION" <<'NODE'
          import { validateSemVer } from "./scripts/release-utils.mjs";
          const version = process.argv[2];
          validateSemVer(version);
          if (version.includes("-") || version.includes("+")) {
            throw new Error(`Recovery version must be stable SemVer: ${version}`);
          }
          NODE
          test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$(git rev-parse HEAD)"
          test -f "docs/releases/$VERSION.md"
          if npm view "arxiv-daily@$VERSION" version >/dev/null 2>&1; then
            echo "Refusing to overwrite existing npm version $VERSION" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify release candidate
        run: |
          npm run check:release-version -- "$VERSION"
          npm run test:release-tools
          npm run check:boundaries
          npm run lint
          npm run typecheck
          NODE_OPTIONS=--max-old-space-size=8192 npm test -- --maxWorkers=1
          npm run build
          npm run smoke:build
      - name: Publish CLI to npm
        run: npm publish --workspace apps/cli --access public --provenance
