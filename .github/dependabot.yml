version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: "/services/email-relay"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/extensions/vscode-arxiv-daily"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/extensions/dsh-arxiv-daily"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: "/tools/node-library-runtime/pdf"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: "/tools/node-library-runtime/embedding"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
