name = "arxiv-daily-email-relay"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# Custom domain (Cloudflare Workers → Domains): mail.arxiv-daily.top

[[kv_namespaces]]
binding = "STORE"
id = "0064f89528ac4aba9ac7b3ac4644220d"
preview_id = "8213e1636f1949a4be4c0d3e7774d25c"

[durable_objects]
bindings = [
  { name = "DELIVER_GATE", class_name = "DeliverGate" },
]

# Free plan requires SQLite-backed Durable Objects
[[migrations]]
tag = "v1-deliver-gate"
new_sqlite_classes = ["DeliverGate"]

[vars]
PUBLIC_BASE_URL = "https://mail.arxiv-daily.top"
FROM_EMAIL = "daily@mail.arxiv-daily.top"
FROM_NAME = "arXiv Daily"
# Public Beta: 1 formal daily + a few tests/retries per verified inbox (UTC day).
# Was briefly 20 during private debugging; do not ship that to the marketplace.
DAILY_QUOTA = "5"

# Secrets (never commit):
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put TOKEN_SECRET
